name: Release

# Publishes to Maven Central (Sonatype Central Portal) with sbt-ci-release:
# a pushed v* tag publishes that release (v1.2.3 -> 1.2.3); a push to main
# publishes a -SNAPSHOT. A tag is only published when its commit is on main.
# Needs the PGP_SECRET, PGP_PASSPHRASE,
# SONATYPE_USERNAME and SONATYPE_PASSWORD repository secrets.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1

      - name: Test
        run: sbt +test

      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
